name: API linting

# Branch pushes are covered by 'pull_request'. Running on both would duplicate the work for PR branches.
on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs of the same PR. Runs on 'master' are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-check-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openapi/package-lock.json
      - name: Install OpenAPI tooling
        run: npm ci --prefix openapi
      - name: Generate OpenAPI variants and bundle
        run: openapi/update.sh
        env:
          BUNDLE_TOOL: npx --no-install redocly
      - name: Validate OpenAPI variants (3.0, 3.1, 3.2)
        run: npm run validate --prefix openapi
      - name: Run linting
        run: |
          cd openapi
          npx --no-install redocly lint \
            --format github-actions \
            --config ../.github/redocly/config.yaml \
            ogcapi-processes.bundled.json

      - name: Commit updated OpenAPI bundle and variants
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Auto-update OpenAPI bundle
          file_pattern: 'openapi/ogcapi-processes.bundled.json openapi/oas3*-ogcapi-processes.yaml'
          branch: ${{ github.head_ref }}
