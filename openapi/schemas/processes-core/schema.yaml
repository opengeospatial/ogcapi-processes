description: Attributes of the features or fields of a coverage range. Defined by a subset of the JSON Schema for the properties of a feature
type: object
required:
- type
- properties
properties:
   type:
     type: string
     enum:
     - object
   required:
     type: array
     minItems: 1
     items:
        type: string
   properties:
     type: object
     default: {}
     additionalProperties:
       type: object
       properties:
         $schema:
           title: JSON Schema version
           description: |-
             URI identifying the JSON Schema dialect used by this definition
             (e.g.: `https://json-schema.org/draft/2020-12/schema`).
             Allows clarifying variants such as the `exclusiveMinimum` and `exclusiveMaximum` (boolean or numeric)
             or nullable representations (`nullable`, `type: [X, "null"]` or `enum: [null]`).
             Must be an absolute URI (`format: uri`).
           type: string
           format: uri
         $id:
           title: Schema identifier
           description: |-
             Identifier of this schema definition.
             Can be an absolute URI or a relative URI reference (`format: uri-reference`), such as `#/definitions/id`.
           type: string
           format: uri-reference
         title:
           type: string
         description:
           type: string
         type:
           description: |-
             Single type (OpenAPI 3.0 / JSON Schema draft-04) or list of types (OpenAPI 3.1+ / JSON Schema 2020-12).
             A list allows nullable values using `type: [X, "null"]`.
           oneOf:
             - type: string
               enum:
               - array
               - boolean
               - integer
               - 'null'
               - number
               - object
               - string
             - type: array
               minItems: 1
               uniqueItems: true
               items:
                 type: string
                 enum:
                 - array
                 - boolean
                 - integer
                 - 'null'
                 - number
                 - object
                 - string
         nullable:
           description: |-
             Nullable values in OpenAPI 3.0 / JSON Schema draft-04, removed in OpenAPI 3.1+.
             Null-only values can be represented with `enum: [null]`.
           type: boolean
         enum:
           type: array
           minItems: 1
           items: {}
           uniqueItems: true
         format:
           type: string
         contentMediaType:
           type: string
         maximum:
           type: number
         exclusiveMaximum:
           description: |-
             Boolean in OpenAPI 3.0 / JSON Schema draft-04, numeric in OpenAPI 3.1+ / JSON Schema 2020-12.
           oneOf:
             - type: boolean
             - type: number
         minimum:
           type: number
         exclusiveMinimum:
           description: |-
             Boolean in OpenAPI 3.0 / JSON Schema draft-04, numeric in OpenAPI 3.1+ / JSON Schema 2020-12.
           oneOf:
             - type: boolean
             - type: number
         pattern:
           type: string
           format: regex
         maxItems:
           type: integer
           minimum: 0
         minItems:
           type: integer
           default: 0
           minimum: 0
         x-ogc-definition:
           type: string
           format: uri
         x-ogc-unit:
           type: string
         x-ogc-unitLang:
           type: string
